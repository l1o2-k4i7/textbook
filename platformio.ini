; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; USB serial monitor / upload settings
monitor_speed = 115200
upload_speed = 921600

; Automatically detect the COM/USB port.
; If auto-detect fails on your PC, uncomment the line below and set
; the correct port (Windows: COMx, macOS: /dev/cu.usbserial-xxxx,
; Linux: /dev/ttyUSB0)
; upload_port = COM3
; monitor_port = COM3

; Show timestamps + line endings nicely in the Serial Monitor
monitor_filters = default, time

; No external libraries required — uses only built-in Arduino GPIO
lib_deps =

; Keep build output tidy
build_flags =
    -D CORE_DEBUG_LEVEL=0