<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Industrial Control Panel</title>
    <meta name="description" content="4-Channel Industrial Control Panel for ESP32 via USB Serial">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ─── Animated background ─── -->
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <!-- ─── Main Container ─── -->
    <div class="app">
        <!-- ─── Header ─── -->
        <header class="header">
            <div class="header-left">
                <div class="logo">
                    <svg class="logo-icon" viewBox="0 0 40 40" fill="none">
                        <rect x="2" y="2" width="36" height="36" rx="8" stroke="url(#logo-grad)" stroke-width="2.5"/>
                        <circle cx="20" cy="20" r="8" fill="url(#logo-grad)"/>
                        <circle cx="20" cy="20" r="4" fill="#0a0e1a"/>
                        <line x1="12" y1="8" x2="12" y2="14" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round"/>
                        <line x1="28" y1="8" x2="28" y2="14" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round"/>
                        <line x1="12" y1="26" x2="12" y2="32" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round"/>
                        <line x1="28" y1="26" x2="28" y2="32" stroke="url(#logo-grad)" stroke-width="2" stroke-linecap="round"/>
                        <defs>
                            <linearGradient id="logo-grad" x1="0" y1="0" x2="40" y2="40">
                                <stop offset="0%" stop-color="#6366f1"/>
                                <stop offset="100%" stop-color="#06b6d4"/>
                            </linearGradient>
                        </defs>
                    </svg>
                    <div>
                        <h1>ESP32 Control Panel</h1>
                        <p class="subtitle">4-Channel Industrial Output Controller</p>
                    </div>
                </div>
            </div>
            <div class="header-right">
                <div class="connection-badge" id="connBadge">
                    <span class="conn-dot" id="connDot"></span>
                    <span id="connText">Disconnected</span>
                </div>
            </div>
        </header>

        <!-- ─── Connection Panel ─── -->
        <section class="card connection-panel" id="connectionPanel">
            <div class="card-header">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M6 3v7a6 6 0 0 0 6 6 6 6 0 0 0 6-6V3"/>
                    <line x1="4" y1="21" x2="20" y2="21"/>
                </svg>
                <h2>USB Connection</h2>
            </div>
            <div class="conn-controls">
                <div class="select-wrapper">
                    <select id="portSelect" class="select">
                        <option value="">— Select COM Port —</option>
                    </select>
                    <button class="btn btn-ghost" id="refreshBtn" title="Refresh ports">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="23 4 23 10 17 10"/>
                            <polyline points="1 20 1 14 7 14"/>
                            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                        </svg>
                    </button>
                </div>
                <button class="btn btn-primary" id="connectBtn">
                    <span class="btn-text">Connect</span>
                    <span class="btn-loader" hidden></span>
                </button>
            </div>
            <div class="conn-info" id="connInfo" hidden>
                <span class="info-chip">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                        <polyline points="22 4 12 14.01 9 11.01"/>
                    </svg>
                    Connected to <strong id="connPortName"></strong>
                </span>
                <span class="info-chip info-chip-fw" id="fwInfo"></span>
            </div>
        </section>

        <!-- ─── Channel Grid ─── -->
        <section class="channels-section" id="channelsSection">
            <div class="section-header">
                <h2>Output Channels</h2>
                <div class="bulk-actions">
                    <button class="btn btn-sm btn-disable" id="allOffBtn" title="Disable all channels">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14"/></svg>
                        All OFF
                    </button>
                </div>
            </div>

            <div class="channel-grid">
                <!-- Channels rendered by JS -->
            </div>
        </section>

        <!-- ─── Log Console ─── -->
        <section class="card log-panel">
            <div class="card-header">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>
                </svg>
                <h2>Activity Log</h2>
                <button class="btn btn-ghost btn-xs" id="clearLogBtn" title="Clear log">Clear</button>
            </div>
            <div class="log-body" id="logBody">
                <div class="log-empty">Waiting for activity…</div>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
